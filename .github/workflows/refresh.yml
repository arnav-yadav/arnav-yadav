name: Refresh profile

# Rebuilds every image and README.md: daily (new fact of the day, fresh ?v=
# cache-busting so GitHub's image proxy picks up changes) and whenever the
# content or generator changes. Commits only when something actually changed.
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST every day
  push:
    paths: ["config.json", "data/**", "tools/**", "vendor/**", "assets/src/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: node tools/build.mjs assets
        env:
          TZ: Asia/Kolkata
      - run: python tools/embed_fonts.py assets/*.svg
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Refresh profile"; git push; }
